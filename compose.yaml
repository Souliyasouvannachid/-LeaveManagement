services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: leave_management
      DB_USER: leave_app
      DB_PASS: ${DB_PASSWORD:-local_dev_password}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: leave_management
      MYSQL_USER: leave_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    volumes:
      - leave_db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  leave_db_data:
